<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخبز ملك - Malak Bakery</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcf8f2;
            text-align: center;
            padding: 40px;
            color: #333;
        }
        h1 {
            color: #d97706;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .intro {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 30px;
        }
        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 200px;
        }
        .card h3 {
            color: #b45309;
            margin-bottom: 10px;
        }
        .price {
            font-weight: bold;
            color: #16a34a;
            margin-top: 10px;
        }
        .info {
            background: #fffbeb;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #fde68a;
        }
    </style>
</head>
<body>

    <h1>مخبز ملك</h1>
    <p class="intro">أشهى المخبوزات الطازجة يومياً بحب وإتقان!</p>

    <div class="menu">
        <div class="card">
            <h3>🥐 كرواسون بالزبدة</h3>
            <p>مقرمش وطازج كل صباح</p>
            <div class="price">25 جنية</div>
        </div>
        <div class="card">
            <h3>🍰 كيك الشيكولاتة</h3>
            <p>غني ولذيذ للغاية</p>
            <div class="price">60 جنية</div>
        </div>
        <div class="card">
            <h3>🍞 خبز طازج</h3>
            <p>ساخن وساحر</p>
            <div class="price">15 جنية</div>
        </div>
    </div>

    <div class="info">
        <h3>📍 العنوان ومواعيد العمل</h3>
        <p><strong>العنوان:</strong> بورسعيد، مصر</p>
        <p><strong>المواعيد:</strong> يومياً من 8 صباحاً حتى 10 مساءً</p>
    </div>

</body>
</html>
